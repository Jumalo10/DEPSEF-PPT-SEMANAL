<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plazo GANPA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Plazo semanal GANPA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#eef2f9;--card:#fff;--ink:#14213d;--mute:#5b6b8c;--line:#d3dcec;--blue:#2a4d9b;--blue-ink:#fff;--field:#f6f8fc;--danger:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1526;--card:#16213a;--ink:#e8eefb;--mute:#93a3c4;--line:#2a3856;--blue:#6f93e6;--blue-ink:#0d1526;--field:#0f1a30;--danger:#ff8a80}}
:root[data-theme="dark"]{--bg:#0d1526;--card:#16213a;--ink:#e8eefb;--mute:#93a3c4;--line:#2a3856;--blue:#6f93e6;--blue-ink:#0d1526;--field:#0f1a30;--danger:#ff8a80}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:16px 14px 170px}
h1{font-size:22px;margin:4px 2px 14px;color:var(--blue);letter-spacing:-.2px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.sec h2{margin:0 0 8px;font-size:17px;color:var(--blue)}
.lbl{width:100%;font:600 16px inherit;font-family:inherit}
input,textarea{width:100%;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:16px/1.35 inherit;font-family:inherit}
textarea{resize:none;overflow:hidden;min-height:44px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 4px}
.dates label{font-size:13px;color:var(--mute);display:block;margin-bottom:3px}
.range{font-size:14px;color:var(--mute);margin:2px 0 10px}
.item{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
.item .d{grid-column:1/2}
.item .t{grid-column:1/3}
.del{background:none;border:1px solid var(--line);color:var(--danger);border-radius:10px;width:44px;height:44px;font-size:20px}
button{font:inherit}
.add{width:100%;margin-top:12px;background:none;border:1.5px dashed var(--blue);color:var(--blue);border-radius:10px;padding:11px;font-weight:600}
.empty{color:var(--mute);font-size:14px;margin:10px 0 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar button{padding:13px;border-radius:12px;border:1px solid var(--blue);font-weight:700}
.p{background:var(--blue);color:var(--blue-ink)}
.full{grid-column:1/3}
.bar button:disabled{opacity:.6}
.s{background:none;color:var(--blue)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
</style>
</head>
<body>
<h1>Asuntos de interés GANPA</h1>
<div id="app"></div>
<div class="bar"><button class="p full" id="dl">Descargar PowerPoint</button><button class="s" id="copy">Copiar texto</button><button class="s" id="reset">Borrar todo</button></div>
<div class="toast" id="toast"></div>
<script>
var M=["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
var KEY="ganpa-plazo-v1";
function A(d,t){return {d:d,t:t}}
var DEF=[
{label:"REALIZADOS:",from:"2026-10-19",to:"2026-10-25",items:[
A("","Continua mantenimiento Mayor 300 hrs / anual ARC 216. Se efectúa socialización DIMAV material pendiente para continuar servicio."),
A("","Mantenimiento Mayor y conservación ARC 226. Envió material reparables acuerdo autorización de recursos."),
A("(16 Oct – 6 NOV/26):","Desarrollo curso operador sistemas O-UAS 06 tripulantes orgánicos BRIM2 - BRIM4 – Gaula B/Tura a bordo GANPA-BNL02."),
A("(19 Oct – 23 Oct / 26):","Desarrollo Curso presencial SMS (Safety Management Systems) a bordo de JCH dirigido por la AAAES. (Instructor FAC)."),
A("(19 – 21 Oct/26):","Calificación 02 Operadores Equipo de Misión Aviación Naval."),
A("(20 OCT/26):","Ejercicio de tiro armas largas y armas cortas"),
A("(20 OCT / 26):","Asistencia 1er Grupo Certificaciones medicas a DMBHM"),
A("(20 – 24 Oct/26)","Entrenamiento ESCATS 04 tripulantes GANPA a bordo ESCAN."),
A("(23 Oct/26)","Licenciamiento del 4 contingente de 2025 por termino de su servicio militar."),
A("","Gestión y seguimiento tiquetes terrestres personal IM12 por termino servicio militar el 23 de Octubre."),
A("","Entrenamiento y sostenimiento contingente 3/26."),
A("(14 – 24 OCT / 26):","Termino comisión en el exterior TN Castro Díaz Andrés por simulador de vuelo."),
A("","Tratamiento de las no conformidades que se encontraron en las inspecciones pasadas del 05 al 10 de octubre de 2026."),
A("","Recepción total contrato papelería FNP"),
A("","Cambio motobomba sector chukio por inicio Fenómeno del Niño."),
A("","Seguimiento garantía motobomba contrato equipos de combustible Juanchaco, Bahía Solano y Pizarro.")]},
{label:"PROGRAMADOS: 07 DIÁS",from:"2026-10-26",to:"2026-11-01",items:[
A("","Inicio pruebas funcionales ARC 216."),
A("(15 Oct – 5 NOV/26):","Desarrollo curso operador sistemas O-UAS 06 tripulantes orgánicos BRIM4 a bordo GANPA-BNL02."),
A("(30 Oct/26)","ARC 225 - Inicio abastecimientos BIM23 y visita sr CFNP-CBRIM2."),
A("(30 Oct/26)","ARC 432 - Visita puestos BIM23 sr CFNP – CBRIM2"),
A("P/C:","Supervivencia y combate en el agua Cont 3/26"),
A("(1-5 Nov/26):","Envío matriz de seguimiento de la Ley 418 a Planeación FNP"),
A("","Elaboración de análisis causa raíz, planes de mejora y (RCA) de las no conformidades realizadas durante la inspección formal y total."),
A("","Recepción combustible 20.000 galones en Juanchaco."),
A("","Cargue proyección Plan vacacional GANPA 2027.")]},
{label:"PROGRAMADOS: 15 DIÁS",from:"2026-11-02",to:"2026-11-08",items:[
A("(05 NOV/26):","Termino curso operador sistemas O-UAS 06 tripulantes orgánicos BRIM4 a bordo GANPA-BNL02"),
A("","Termino de comisión de servicio de TN Manzur, S2 Zuleta y S3 Portillo."),
A("","Cargue de análisis causa raíz, planes de mejora y (RCA) de las no conformidades realizadas durante la inspección formal y total para cumplimiento de plazos.")]},
{label:"PROGRAMADOS: 30 DIÁS",from:"2026-11-09",to:"2026-11-15",items:[
A("(09 Sep/26 – 25 Nov/26):","S3 Lievano Jhon Comisión en el exterior – curso asistencia medica."),
A("","Programación Polígono Aéreo, fecha por confirmar acuerdo disponibilidad."),
A("","Recibimiento combustible JETA1 a bordo de Pizarro."),
A("","Participación y coordinación BINGO FNP"),
A("","Tratamiento y elaboración de análisis causa raíz, planes de mejora y (RCA) de las oportunidades de mejora realizadas durante la inspección formal y total")]}
];
var data;
try{var s=localStorage.getItem(KEY);data=s?JSON.parse(s):null}catch(e){data=null}
if(!data||!data.length)data=JSON.parse(JSON.stringify(DEF));
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function fmt(iso){if(!iso)return "";var p=iso.split("-");return p[2]+" "+M[+p[1]-1]+"/"+p[0].slice(2)}
function range(s){return (s.from||s.to)?fmt(s.from)+" – "+fmt(s.to):""}
function head(s){var r=range(s);return s.label+(r?" ("+r+")":"")}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("on");setTimeout(function(){t.classList.remove("on")},1600)}
function grow(el){el.style.height="auto";el.style.height=el.scrollHeight+"px"}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.textContent=html;return e}
function render(){
var app=document.getElementById("app");app.innerHTML="";
data.forEach(function(s,si){
var sec=el("section","sec");
var h=el("h2",null,head(s));sec.appendChild(h);
var lab=el("input","lbl");lab.value=s.label;lab.setAttribute("aria-label","Título de la sección");
lab.oninput=function(){s.label=lab.value;h.textContent=head(s);save()};sec.appendChild(lab);
var dg=el("div","dates");
["from","to"].forEach(function(k){
var w=el("div");var l=el("label",null,k==="from"?"Desde":"Hasta");var i=el("input");i.type="date";i.value=s[k]||"";
i.onchange=function(){s[k]=i.value;h.textContent=head(s);save()};
w.appendChild(l);w.appendChild(i);dg.appendChild(w)});
sec.appendChild(dg);
if(!s.items.length)sec.appendChild(el("p","empty","Aún no hay actividades. Toca “Agregar actividad”."));
s.items.forEach(function(it,ii){
var row=el("div","item");
var d=el("input","d");d.placeholder="Fecha (opcional), ej: (30 Oct/26)";d.value=it.d;d.oninput=function(){it.d=d.value;save()};
var x=el("button","del","×");x.setAttribute("aria-label","Eliminar actividad");
x.onclick=function(){if(confirm("¿Eliminar esta actividad?")){s.items.splice(ii,1);save();render()}};
var t=el("textarea","t");t.placeholder="Actividad";t.value=it.t;t.oninput=function(){it.t=t.value;grow(t);save()};
row.appendChild(d);row.appendChild(x);row.appendChild(t);sec.appendChild(row);
setTimeout(function(){grow(t)},0)});
var add=el("button","add","+ Agregar actividad");
add.onclick=function(){s.items.push(A("",""));save();render();var ts=document.querySelectorAll("section")[si].querySelectorAll("textarea");if(ts.length)ts[ts.length-1].focus()};
sec.appendChild(add);app.appendChild(sec)})}
function text(){
return data.map(function(s){
var r=range(s);var hd="*"+s.label+(r?" ("+r+")":"")+"*";
var lines=s.items.filter(function(i){return i.d.trim()||i.t.trim()}).map(function(i){return "• "+(i.d.trim()?"*"+i.d.trim()+"* ":"")+i.t.trim()});
return hd+"\n"+lines.join("\n")}).join("\n\n")}
document.getElementById("copy").onclick=function(){
var tx="*Asuntos de interés GANPA*\n\n"+text();
function fb(){var a=document.createElement("textarea");a.value=tx;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.focus();a.select();try{document.execCommand("copy");toast("Texto copiado")}catch(e){toast("No se pudo copiar")}document.body.removeChild(a)}
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tx).then(function(){toast("Texto copiado")},fb)}else fb()};
document.getElementById("reset").onclick=function(){
if(confirm("¿Borrar todas las actividades y fechas para empezar una semana nueva? Se conservarán los títulos.")){
data.forEach(function(s){s.items=[];s.from="";s.to=""});save();render()}};
render();
(function(){try{var c=document.createElement("canvas");c.width=c.height=180;var g=c.getContext("2d");
g.fillStyle="#2a4d9b";g.fillRect(0,0,180,180);g.fillStyle="#fff";g.beginPath();
g.moveTo(90,28);g.lineTo(140,46);g.lineTo(140,92);g.quadraticCurveTo(140,130,90,154);g.quadraticCurveTo(40,130,40,92);g.lineTo(40,46);g.closePath();g.fill();
g.fillStyle="#2a4d9b";g.beginPath();g.moveTo(90,50);g.lineTo(120,61);g.lineTo(120,92);g.quadraticCurveTo(120,116,90,132);g.quadraticCurveTo(60,116,60,92);g.lineTo(60,61);g.closePath();g.fill();
var l=document.createElement("link");l.rel="apple-touch-icon";l.href=c.toDataURL("image/png");document.head.appendChild(l)}catch(e){}})();
</script>
